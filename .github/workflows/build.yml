name: Build Infinity Gauntlet Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Mod JAR with Gradle
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            ERR=$(grep -E "error:|FAILURE:|What went wrong|> " build.log | tail -n 35 | tr '\n' ' ')
            echo "::error title=GradleBuildError::$ERR"
            exit $CODE
          fi

      - name: Publish Release JAR and Commit to Branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p releases
          cp build/libs/infinity_gauntlet-1.0.0.jar releases/infinity_gauntlet-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/infinity_gauntlet-1.0.0.jar
          git diff --cached --quiet || (git commit -m "Собран релизный JAR мода infinity_gauntlet-1.0.0.jar [skip ci]" && git push origin HEAD:${{ github.ref_name }})
          gh release create v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar \
            --title "Перчатка Бесконечности v1.0.0 (Minecraft 1.21.1 / NeoForge)" \
            --notes "Готовый .jar файл мода «Перчатка Бесконечности» для Minecraft 1.21.1 (NeoForge 21.1.176)." \
            --target "${{ github.sha }}" || \
          gh release upload v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar --clobber
