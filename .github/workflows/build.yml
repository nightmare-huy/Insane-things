name: Build Infinity Gauntlet Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Mod JAR with Gradle
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            ERR=$(grep -E "error:|FAILURE:|What went wrong|> " build.log | tail -n 35 | tr '\n' ' ')
            echo "::error title=GradleBuildError::$ERR"
            exit $CODE
          fi

      - name: Smoke Test Mod in Real Minecraft 1.21.1 + NeoForge Client
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libglfw3
          set +e
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PinfinityGauntletSmokeTest=true --no-daemon > client.log 2>&1
          CODE=$?
          cat client.log
          if grep -q "\[INFINITY_GAUNTLET_SMOKE_TEST_PASSED\]" client.log; then
            echo "::notice title=SmokeTestPassed::Minecraft 1.21.1 + NeoForge 21.1.176 Client loaded infinity_gauntlet and verified all items, creative tabs, and 3D model!"
          else
            ERR=$(grep -E "Exception|Error|Caused by:|FATAL|FAILURE:|Invalid|ModLoadingException" client.log | tail -n 35 | tr '\n' ' ')
            echo "::error title=ClientSmokeTestFailed::Exit=$CODE $ERR"
            exit 1
          fi

      - name: Publish Release JAR and Commit to Branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p releases
          cp build/libs/infinity_gauntlet-1.0.0.jar releases/infinity_gauntlet-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/infinity_gauntlet-1.0.0.jar
          git diff --cached --quiet || (git commit -m "Обновлён и протестирован JAR мода infinity_gauntlet-1.0.0.jar [skip ci]" && git push origin HEAD:${{ github.ref_name }})
          gh release upload v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar --clobber || \
          gh release create v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar \
            --title "Перчатка Бесконечности v1.0.0 (Minecraft 1.21.1 / NeoForge)" \
            --notes "Протестированный в клиенте Minecraft 1.21.1 (NeoForge 21.1.176) .jar файл мода «Перчатка Бесконечности»." \
            --target "${{ github.sha }}"
