name: Build Infinity Gauntlet Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Mod JAR with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity_gauntlet-1.0.0
          path: build/libs/*.jar

      - name: Publish Release JAR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p releases
          cp build/libs/infinity_gauntlet-1.0.0.jar releases/infinity_gauntlet-1.0.0.jar
          gh release create v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar \
            --title "Перчатка Бесконечности v1.0.0 (Minecraft 1.21.1 / NeoForge)" \
            --notes "Собранный .jar мода Перчатка Бесконечности для Minecraft 1.21.1 (NeoForge 21.1.176)." \
            --target "${{ github.sha }}" || \
          gh release upload v1.0.0 build/libs/infinity_gauntlet-1.0.0.jar --clobber
